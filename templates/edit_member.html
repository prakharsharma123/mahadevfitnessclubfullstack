{% extends "base.html" %}
{% block title %}Edit Member | Gym Management System{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <h1>Edit Member</h1>
    <p class="muted">Update {{ m.name }}'s details</p>
  </div>
</div>

<div class="form-card">
  <form method="POST" enctype="multipart/form-data" class="form-grid">

    <div class="form-photo-upload">
      {% if photo_src(m) %}
        <img id="photoPreview" class="photo-preview" src="{{ photo_src(m) }}" alt="{{ m.name }}">
        <div id="photoPlaceholder" class="photo-preview photo-preview-placeholder" style="display:none;">📷</div>
      {% else %}
        <img id="photoPreview" class="photo-preview" src="" alt="" style="display:none;">
        <div id="photoPlaceholder" class="photo-preview photo-preview-placeholder">📷</div>
      {% endif %}
      <label class="btn btn-outline btn-sm">
        Change Photo
        <input type="file" name="photo" accept="image/*" id="photoInput" style="display:none;">
      </label>
    </div>

    <div>
      <label>Full Name</label>
      <input type="text" name="name" required value="{{ m.name }}">
    </div>

    <div>
      <label>Phone Number</label>
      <input type="tel" name="phone" required value="{{ m.phone }}">
    </div>

    <div>
      <label>Plan</label>
      <select name="plan" id="planSelect" required>
        {% for key, label in PLAN_CHOICES %}
          <option value="{{ key }}" {{ 'selected' if m.plan==key }}>{{ label }} — ₹{{ plan_fees[key] }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Fees (₹)</label>
      <input type="number" name="fees" id="feesInput" required value="{{ m.fees }}">
    </div>

    <div>
      <label>Last Fee Paid Date (renewal day of month stays fixed)</label>
      <input type="date" name="last_fee_date" required value="{{ m.last_fee_date }}">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('members') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
{% block scripts %}
<script>
  const planFees = {{ plan_fees|tojson }};
  document.getElementById('planSelect').addEventListener('change', function () {
    document.getElementById('feesInput').value = planFees[this.value];
  });
  document.getElementById('photoInput').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('photoPreview');
      img.src = e.target.result;
      img.style.display = 'block';
      document.getElementById('photoPlaceholder').style.display = 'none';
    };
    reader.readAsDataURL(file);
  });
</script>
{% endblock %}
